name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  TINYGO_VERSION: "0.44.0"

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  test-wasm-go:
    name: Go WASM Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Disable AppArmor Chrome restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install wasmbrowsertest
        run: |
          go install github.com/agnivade/wasmbrowsertest@latest
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec

      - name: Run GOOS=js WASM tests
        run: |
          WASM_PKGS=(
            "."
            "./keyer"
            "./nip04"
            "./nip05"
            "./nip06"
            "./nip10"
            "./nip11"
            "./nip13"
            "./nip14"
            "./nip17"
            "./nip19"
            "./nip22"
            "./nip23"
            "./nip27"
            "./nip29"
            "./nip31"
            "./nip34"
            "./nip40"
            "./nip42"
            "./nip44"
            "./nip45"
            "./nip45/hyperloglog"
            "./nip46"
            "./nip49"
            "./nip52"
            "./nip53"
            "./nip54"
            "./nip57"
            "./nip59"
            "./nip60"
            "./nip60/client"
            "./nip61"
            "./nip65"
            "./nip70"
            "./nip73"
            "./nip77"
            "./nip77/negentropy"
            "./nip77/negentropy/storage"
            "./nip77/negentropy/storage/empty"
            "./nip77/negentropy/storage/vector"
            "./nip92"
            "./nip94"
            "./nipb0/blossom"
          )
          GOOS=js GOARCH=wasm go test -short "${WASM_PKGS[@]}"

  test-wasm-tinygo:
    name: TinyGo WASM Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb
          sudo dpkg -i tinygo_${TINYGO_VERSION}_amd64.deb

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Disable AppArmor Chrome restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install wasmbrowsertest
        run: |
          go install github.com/agnivade/wasmbrowsertest@latest
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec

      - name: Run TinyGo WASM tests
        run: |
          WASM_PKGS=(
            "."
            "./keyer"
            "./nip04"
            "./nip05"
            "./nip06"
            "./nip10"
            "./nip11"
            "./nip13"
            "./nip14"
            "./nip17"
            "./nip19"
            "./nip22"
            "./nip23"
            "./nip27"
            "./nip29"
            "./nip31"
            "./nip34"
            "./nip40"
            "./nip42"
            "./nip44"
            "./nip45"
            "./nip45/hyperloglog"
            "./nip46"
            "./nip49"
            "./nip52"
            "./nip53"
            "./nip54"
            "./nip57"
            "./nip59"
            "./nip60"
            "./nip60/client"
            "./nip61"
            "./nip65"
            "./nip70"
            "./nip73"
            "./nip77"
            "./nip77/negentropy"
            "./nip77/negentropy/storage"
            "./nip77/negentropy/storage/empty"
            "./nip77/negentropy/storage/vector"
            "./nip92"
            "./nip94"
            "./nipb0/blossom"
          )
          GOOS=js GOARCH=wasm tinygo test -short "${WASM_PKGS[@]}"

  test-wasm-tinygo-compile:
    name: TinyGo WASM Compile (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb
          sudo dpkg -i tinygo_${TINYGO_VERSION}_amd64.deb

      # Runs zero tests, so this needs only Node (bundled with TinyGo's runner),
      # not a browser. It still compiles every package and its test binary for
      # js/wasm, catching regressions in packages without a runtime test job.
      - name: Compile every package for TinyGo/wasm
        run: GOOS=js GOARCH=wasm tinygo test -run '^$' ./...
